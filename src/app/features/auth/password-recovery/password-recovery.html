<section class="welcome-screen screen-scroll">
  <div class="welcome-radiograph" aria-hidden="true"></div>
  <header class="auth-visual">
    <div class="welcome-brand">
      <h1>Meu Plant&#227;o</h1>
      <div class="brand-subtitle">RADIOLOGIA</div>
    </div>
    <p class="welcome-description">Controle de plant&#245;es, horas e registros de ponto.</p>
  </header>

  <div class="auth-content" #recoveryFields>
    @if (auth.view() === 'new-password') {
      <div class="auth-heading"><h2>Nova senha</h2></div>
      <form class="auth-form" (ngSubmit)="update()" novalidate>
        <label class="auth-field">
          <span>Nova senha</span>
          <span class="input-shell">
            <svg lucideLockKeyhole class="ui-icon"></svg>
            <input name="newPassword" type="password" placeholder="Digite sua nova senha" autocomplete="new-password" minlength="6" [(ngModel)]="password" (ngModelChange)="clearError('password')" required />
          </span>
          @if (errors['password']) { <app-field-error [message]="errors['password']" /> }
        </label>
        <label class="auth-field">
          <span>Confirmar nova senha</span>
          <span class="input-shell">
            <svg lucideLockKeyhole class="ui-icon"></svg>
            <input name="confirmNewPassword" type="password" placeholder="Repita sua nova senha" autocomplete="new-password" [(ngModel)]="confirmation" (ngModelChange)="clearError('confirmation')" required />
          </span>
          @if (errors['confirmation']) { <app-field-error [message]="errors['confirmation']" /> }
        </label>
        <button class="button-primary auth-submit" type="submit" [disabled]="auth.busy()">
          {{ auth.busy() ? 'Salvando...' : 'Salvar nova senha' }}
        </button>
      </form>
    } @else {
      <div class="auth-heading"><h2>Recuperar senha</h2></div>
      <form class="auth-form" (ngSubmit)="request()" novalidate>
        <label class="auth-field">
          <span>E-mail</span>
          <span class="input-shell">
            <svg lucideMail class="ui-icon"></svg>
            <input name="recoveryEmail" type="email" placeholder="seu@email.com" autocomplete="email" [ngModel]="auth.email()" (ngModelChange)="auth.email.set($event); clearError('email')" required />
          </span>
          @if (errors['email']) { <app-field-error [message]="errors['email']" /> }
        </label>
        <button class="button-primary auth-submit" type="submit" [disabled]="auth.busy()">
          {{ auth.busy() ? 'Enviando...' : 'Enviar link de recuperação' }}
        </button>
      </form>
    }
    <button class="signup-back" type="button" (click)="auth.show('login')">
      <svg lucideArrowLeft class="ui-icon"></svg>Voltar ao login
    </button>
  </div>
</section>
